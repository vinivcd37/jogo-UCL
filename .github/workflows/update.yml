name: Atualizar dados da Champions
on:
  schedule:
    - cron: "*/10 15-23 * * 2-4"   # terça a quinta, 15h-23h UTC: a cada 10 min
    - cron: "0 */3 * * *"          # demais horarios: a cada 3 h
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-matches
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/update.py
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      - name: Commit se mudou
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add data/matches.json
          git diff --cached --quiet || (git commit -m "dados: atualização automática" && git push)
